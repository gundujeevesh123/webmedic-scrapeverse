[project]
name = "webmedic"
version = "0.1.0"
description = "Self-healing web scrapers — detect DOM drift, propose candidates, gate every fix against evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Gundu Jeevesh Laahiri", email = "sudheer.yakkala@gmail.com" },
]
keywords = ["web-scraping", "self-healing", "resilience", "hackathon", "scrapeverse"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.8.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "hypothesis>=6.112.0",
]

[project.urls]
Homepage = "https://github.com/gundujeevesh123/webmedic-scrapeverse"
Repository = "https://github.com/gundujeevesh123/webmedic-scrapeverse"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["tests*", "benchmark*", "demo*", "docs*", "scripts*"]

# --------------------------------------------------------------------------
# Ruff — lint + import sort. Style checks live here so `ruff check backend/`
# is the single command judges (and CI) run.
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures", "demo", "benchmark"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear (except-as, mutable-defaults, ...)
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line-length is enforced by black
    "B008",    # allow FastAPI Depends() in defaults
    "SIM108",  # explicit if/else can be clearer than ternary
    "N803",    # allow snake_case in FastAPI query params
    "N806",    # allow ALL_CAPS locals for the score weights (W_SCHEMA, ...)
    "N818",    # exception names — ProviderUnavailable is public API
    "RUF002",  # en-dashes in prose docstrings are intentional
    "RUF003",  # en-dashes in prose comments are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806", "B011"]  # test names + magic constants
"backend/api/app.py" = ["B008"]         # Depends() defaults

[tool.ruff.lint.pydocstyle]
convention = "google"

# --------------------------------------------------------------------------
# Black — non-controversial formatter, same line-length as ruff.
# --------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "tests/fixtures|demo|benchmark"

# --------------------------------------------------------------------------
# mypy — strict on the backend, permissive on tests + benchmarks.
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = "tests/fixtures/|benchmark/|scripts/"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false

# --------------------------------------------------------------------------
# pytest — coverage gate the README claims (>= 85 %).
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:bs4.builder._lxml",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/api/app.py",   # thin FastAPI glue, hit by integration tests
    "backend/api/demo_cli.py",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
